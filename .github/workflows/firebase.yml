name: Pubblica il server Firebase
on:
  push:
    branches: [main]
    paths: ['firebase/**', 'engine.js', 'data.js']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Credenziali
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Pubblica regole (e funzioni, se presenti)
        working-directory: firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          mkdir -p functions/game && cp ../engine.js ../data.js functions/game/
          (cd functions && npm ci --no-audit --no-fund)
          npx -y firebase-tools@latest deploy --project "${{ vars.FIREBASE_PROJECT_ID }}" --only database,functions --non-interactive --force
          npx -y firebase-tools@latest database:update /config --data '{"rankedServer":true,"economyServer":true}' --project "${{ vars.FIREBASE_PROJECT_ID }}" --instance elgravion-default-rtdb --force
