<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Elgravion TCG</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a1622">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elgravion">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<style>
:root{--bg:#1a1622;--panel:#241e2c;--line:#4a4058;--gold:#c9a24b;--gold2:#f1e3b8;--txt:#ece4d2;--mut:#a39a8a;--atk:#d9822b;--def:#b3263a;--sz:max(40px,min(calc((100vw - 34px) / 7),150px,calc((100dvh - 490px) / 2.64)))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 40%,#3a3048,#16121c 75%);color:var(--txt);font-family:'EB Garamond',Georgia,serif;overflow:hidden}
button{font-family:Cinzel,serif;cursor:pointer}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none}
.table{user-select:none;-webkit-user-select:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}
/* ---------- Menu */
.menu{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 14px;gap:14px}
.menu h1{font-family:Cinzel,serif;font-weight:900;letter-spacing:6px;color:var(--gold2);font-size:clamp(30px,7vw,54px);margin:6px 0 0;text-shadow:0 2px 12px #000}
.menu .sub{color:var(--mut);margin-top:-8px}
.classes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.cls{width:170px;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);cursor:pointer;transition:.15s}
.cls.on{border-color:var(--gold);box-shadow:0 0 18px #c9a24b66}
.cls img{width:100%;height:150px;object-fit:cover;display:block}
.cls div{padding:8px;text-align:center;font-family:Cinzel,serif;font-size:14px;color:var(--gold2)}
.cls small{display:block;font-family:'EB Garamond';color:var(--mut);font-size:13px}
.btn{background:linear-gradient(#3a2d17,#241b0e);border:1px solid var(--gold);color:var(--gold2);padding:10px 18px;border-radius:10px;font-size:15px;letter-spacing:1px}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:6px 10px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
input.code{background:#0b0a0e;border:1px solid var(--line);color:var(--gold2);font-family:Cinzel;font-size:18px;letter-spacing:4px;width:110px;text-align:center;padding:8px;border-radius:8px;text-transform:uppercase}
.note{max-width:560px;color:var(--mut);font-size:14px;text-align:center}
/* ---------- Tavolo */
.table{flex:1;display:flex;flex-direction:column;min-height:0}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(#2c2534,#1b1622);border-bottom:1px solid #8a6d2c;box-shadow:0 2px 10px #000a;position:relative;z-index:3}
.bar .side{display:flex;align-items:center;gap:8px;min-width:0}
.bar .side.r{justify-content:flex-end}
.bar .mid{display:flex;align-items:center;gap:14px}
.bar.me{border-top:1px solid #6b5420;border-bottom:none;background:linear-gradient(#1b1622,#2c2534)}
.hero{position:relative;width:86px;height:86px;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 2px #000,0 0 0 4px #6b5420,0 6px 16px #000c;overflow:visible;flex:none;cursor:pointer}
.hero img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.hero .pf{position:absolute;right:-8px;bottom:-6px;background:var(--def);border:1.5px solid var(--gold);border-radius:6px 6px 14px 14px;font-family:Cinzel;font-weight:900;font-size:14px;min-width:28px;text-align:center;padding:1px 3px}
.hero .ar{position:absolute;left:-8px;bottom:-6px;background:#566;border:1.5px solid #ccc;border-radius:6px;font-family:Cinzel;font-weight:700;font-size:12px;padding:1px 4px}
.hero.mut{border-color:#b59cff;box-shadow:0 0 12px #8a64bf}
.info{display:flex;flex-direction:column;gap:2px;font-size:13px;min-width:0}
.info b{font-family:Cinzel;color:var(--gold2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gra{display:flex;align-items:center;gap:4px;font-family:Cinzel;font-weight:700}
.gra img{width:22px;height:22px}
.pill{font-size:12px;color:var(--mut);background:#0006;border:1px solid var(--line);border-radius:8px;padding:2px 6px;white-space:nowrap}
.spacer{flex:1}
.power{width:50px;height:50px;border-radius:50%;padding:3px;background:conic-gradient(#f5dd96,#9a7426,#e8c56c,#7a5a18,#f5dd96);position:relative;flex:none;cursor:pointer}
.power img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.power .c{position:absolute;top:-6px;left:-6px;width:22px;height:22px;background:url(art/gra_oro.svg) center/contain;font-family:Cinzel;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;-webkit-text-stroke:.8px #000;color:#fff}
.power.off{filter:grayscale(1) brightness(.5)}
.power.can{box-shadow:0 0 0 2px #fff3cf,0 0 16px #ffd34d;animation:glow 1.6s ease-in-out infinite;touch-action:none}
.power.sel{box-shadow:0 0 0 3px #fff,0 0 18px #fff}
@keyframes glow{50%{box-shadow:0 0 0 2px #fff3cf,0 0 26px #ffd34d}}
.dragline{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.unit.ready,.hero.ready{touch-action:none}
.ghost.spell{transform:translate(-50%,-100%) scale(.8);opacity:.9}
.unit.hov{box-shadow:0 0 0 4px #fff,0 0 22px #ff5a5a}
.mc.can{box-shadow:0 0 0 2px #7fe07f,0 0 12px #7fe07f}
.unit.emp:not(.ready):not(.tg):not(.sel){box-shadow:0 0 0 2px var(--emo),0 0 14px var(--emo)}
.emorow{margin:-4px 0}
.emorow .slots{grid-template-rows:20px}
.emk{height:20px;display:flex;align-items:center;justify-content:center}
.emk.pad{width:var(--sw,var(--sz))}
.emk.on img{width:20px;height:20px;padding:2px;border-radius:50%;background:radial-gradient(var(--emo),#000 85%);box-shadow:0 0 8px var(--emo);border:1px solid var(--emo)}
.emk.on::before,.emk.on::after{content:'';flex:1;height:2px;margin:0 4px;background:linear-gradient(90deg,transparent,var(--emo));opacity:.8}
.emk.on::after{background:linear-gradient(90deg,var(--emo),transparent)}
.endbtn{background:linear-gradient(#5b4314,#2e2209);border:1.5px solid var(--gold);color:#fff3cf;font-family:Cinzel;font-weight:700;border-radius:12px;padding:10px 12px;font-size:13px}
.timer{font-family:Cinzel;font-size:12px;color:#e8d9a8;background:#1a1408;border:1px solid #6b5420;border-radius:10px;padding:5px 8px;white-space:nowrap}
.timer.low{color:#fff;background:#7a1620;border-color:#ff5a6a;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.hero .ha{position:absolute;left:-4px;bottom:-4px;background:#c98a1a;color:#fff;border:2px solid #fff3cf;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.hero.ready{box-shadow:0 0 0 3px #3ddc84,0 0 14px #3ddc84;cursor:pointer}
.hero.sel{box-shadow:0 0 0 3px #fff,0 0 18px #fff}
/* Pegno: spazio a destra del tavolo, a specchio */
.brow{display:flex;justify-content:center;gap:10px;align-items:stretch}
.pslot{width:var(--sw,var(--sz));height:calc(var(--sz)*var(--sh,1.32));border:1.5px dashed var(--gold);border-radius:9px;position:relative;overflow:hidden;cursor:pointer;background:#0007;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--gold2);font-family:Cinzel;font-size:11px;flex:none}
.pslot.full{border-style:solid;box-shadow:inset 0 0 0 1px #000,0 0 10px #c9a24b44}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.75) brightness(.45)}
.pslot .bk{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#2b2236,#2b2236 6px,#1b1524 6px,#1b1524 12px)}
.pslot .chains{position:absolute;inset:0;background:linear-gradient(35deg,transparent 46%,#8a7a5a99 47%,#8a7a5a99 53%,transparent 54%),linear-gradient(-35deg,transparent 46%,#8a7a5a99 47%,#8a7a5a99 53%,transparent 54%)}
.pslot .lock{position:relative;font-size:calc(var(--sz)*.36);line-height:1;filter:drop-shadow(0 2px 4px #000)}
.pslot .pl{position:relative;margin-top:4px;background:#000c;border:1px solid var(--gold);border-radius:8px;padding:1px 6px;font-weight:700;color:#fff}
.pslot .pn{position:absolute;top:3px;left:3px;right:3px;font-size:9px;line-height:1.05;text-align:center;color:var(--gold2);text-shadow:0 1px 2px #000}
.pslot.open{border-color:#3ddc84;box-shadow:0 0 14px #3ddc84aa} .pslot.open img{filter:none}
.pslot .lbl{position:relative;font-size:10px;opacity:.8}
/* Leggendarie: rosone */
.rose{position:absolute;width:30px;height:30px;z-index:4;filter:drop-shadow(0 2px 3px #000)}
.mc img.rose{top:2px;right:2px;width:28px;height:28px}
.unit img.rose{top:auto;bottom:2px;opacity:1;object-fit:contain;left:50%;transform:translateX(-50%);width:calc(var(--sz)*.3);height:calc(var(--sz)*.3)}
.mc.leg,.unit.leg{border-color:#e8c56c;box-shadow:0 0 10px #ffb84a88}
.big img.rose{top:8px;right:8px;left:auto;transform:none;width:50px;height:50px;opacity:1}
.coll{height:100%;overflow:auto;padding:12px 12px 30px;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;align-items:center;gap:12px} .chead h2{font-family:Cinzel;color:var(--gold2);margin:0;font-size:24px;letter-spacing:2px;flex:1}
.ctabs{display:flex;gap:6px;flex-wrap:wrap}
.ctab{display:flex;align-items:center;gap:6px;background:#15121a;border:1px solid var(--line);border-bottom:3px solid var(--uc);color:var(--txt);padding:6px 10px;border-radius:10px;font-size:13px}
.ctab img{width:20px;height:20px} .ctab .nz{color:var(--uc);font-size:16px}
.ctab.on{background:linear-gradient(#2a2230,#15121a);border-color:var(--uc);box-shadow:0 0 12px var(--uc);color:#fff}
.chero{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(90deg,#2a2232,#1a1520);border:1px solid var(--uc);border-radius:14px;padding:10px}
.chero .cp{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:none}
.chero .ci{display:flex;flex-direction:column;gap:6px;font-size:13.5px;min-width:0} .chero .ci>b{font-family:Cinzel;color:var(--gold2);font-size:17px} .chero small{color:var(--mut)}
.cpw{display:flex;gap:8px;align-items:center} .cpw img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex:none}
.cfil{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cfil select,.cfil input#fQ{background:#0b0a0e;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 8px;font-family:inherit;font-size:14px}
.cfil input#fQ{flex:1;min-width:150px} .ftok{font-size:13px;color:var(--mut);display:flex;gap:4px;align-items:center}
@media (max-width:560px){ .slots{gap:3px} .brow{gap:6px} .board{padding:6px 2px} .chero .cp{width:64px;height:64px} .chead h2{font-size:19px} }
.cmal{margin-top:6px;padding:7px 10px;border-left:3px solid #b59cff;background:#b59cff14;border-radius:6px;color:#e6dcff;line-height:1.35}
.rg{position:absolute;left:50%;bottom:5px;width:14px;height:14px;transform:translateX(-50%) rotate(45deg);border:1.5px solid #000;z-index:4;box-shadow:0 0 0 1px #fff8,0 0 10px var(--rgc);background:radial-gradient(circle at 35% 35%,#fff,var(--rgc) 55%,#000 120%)}
.rg.rc{--rgc:#e9e9e9} .rg.rr{--rgc:#3d8bff} .rg.re{--rgc:#b45cff} .rg.rl{--rgc:#ff9a1f}
.unit .rg{bottom:7px;width:13px;height:13px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;justify-items:center}
.cc{width:190px;height:290px;border-radius:12px;border:2px solid var(--uc);background:linear-gradient(#272030,#1a1520);position:relative;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s;box-shadow:0 6px 16px #000a;overflow:hidden}
.cc:hover{transform:translateY(-4px) scale(1.03);z-index:2}
.cc.leg{border-color:#e8c56c;box-shadow:0 0 14px #ffb84a88,0 6px 16px #000a}
.cc.nodeck{opacity:.55}
.cc .cart{position:relative;height:120px;flex:none;border-bottom:1px solid #c9a24b55}
.cc .cart img.ar{width:100%;height:100%;object-fit:cover;display:block}
.cc .cart .ph{height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff6;background:linear-gradient(135deg,#2a2335,#14111a)}
.cc .cost{position:absolute;top:4px;left:4px;width:34px;height:34px;background:url(art/gra_oro.svg) center/contain;font-family:Cinzel;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;color:#fff;-webkit-text-stroke:1px #000}
.cc img.rose{position:absolute;top:4px;right:4px;width:36px;height:36px;filter:drop-shadow(0 2px 3px #000)}
.cc .cnm{font-family:Cinzel;font-weight:700;color:var(--gold2);font-size:13px;line-height:1.15;padding:6px 8px 4px;text-align:center}
.tplate{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px;margin:0 8px 4px;padding:3px 8px;font-family:Cinzel;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:#f1e3b8;
  background:linear-gradient(#2c2416,#16110a);border:1px solid #c9a24b;border-radius:3px;position:relative;box-shadow:inset 0 0 0 1px #000,inset 0 0 8px #000a,0 1px 0 #000}
.tplate::before,.tplate::after{content:'';position:absolute;top:50%;width:7px;height:7px;background:#c9a24b;border:1px solid #000;transform:translateY(-50%) rotate(45deg)}
.tplate::before{left:-4px} .tplate::after{right:-4px}
.tplate i{font-style:normal;color:#c9a24b;font-size:7px}
.tplate.r-c span:last-child{color:#e9e9e9} .tplate.r-r span:last-child{color:#7fb2ff} .tplate.r-e span:last-child{color:#d39bff} .tplate.r-l span:last-child{color:#ffb84a}
.cc .ctx{flex:1;min-height:0;font-size:11.5px;line-height:1.25;padding:2px 10px;color:#ddd;overflow:hidden;text-align:center;max-height:calc(6 * 1.25em + 4px)}
.cc .cbot{height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 6px;border-top:1px solid #c9a24b33;background:#0007;position:relative}
.cc .cbot .a,.cc .cbot .d{width:26px;height:26px;border-radius:50%;font-family:Cinzel;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;color:#fff;border:1.5px solid var(--gold)}
.cc .cbot .a{background:var(--atk)} .cc .cbot .d{background:var(--def);border-radius:6px 6px 13px 13px}
.cc .cbot .rg{position:static;transform:rotate(45deg);width:15px;height:15px}
.big .tplate{margin:2px 10px 6px}
@media (max-width:560px){ .cgrid{grid-template-columns:repeat(2,1fr);gap:10px} .cc{width:100%;height:300px} .cc .cart{height:100px} }
/* ---------- Cornice di fazione su tutte le carte */
.mc,.cc,.big,.unit{border:3px solid var(--uc)!important;box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2.5px color-mix(in srgb,#e8c56c 70%,transparent),0 0 0 1px #000,0 4px 12px #000a}
.mc.leg:not(.can):not(.selh),.cc.leg,.big:has(img.rose),.unit.leg:not(.ready):not(.tg):not(.sel):not(.hov):not(.emp){box-shadow:inset 0 0 0 1px #000,inset 0 0 0 2.5px #f5dd96,0 0 0 1px #000,0 0 14px #ffb84aaa}
.mc .nm,.cc .cnm{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--uc) 35%,transparent),transparent)}
.mc .mbot,.cc .cbot{background:linear-gradient(0deg,color-mix(in srgb,var(--uc) 45%,#000),transparent)}
.big .h{background:linear-gradient(90deg,color-mix(in srgb,var(--uc) 45%,transparent),transparent)}
/* sullo slot: fasce piene del colore di fazione, sotto ai numeri */
.unit .nm{background:linear-gradient(color-mix(in srgb,var(--uc) 88%,#000) 0%,color-mix(in srgb,var(--uc) 55%,transparent) 70%,transparent)!important;color:#fff;text-shadow:0 1px 2px #000;z-index:2}
.unit::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(0deg,color-mix(in srgb,var(--uc) 85%,#000) 0%,color-mix(in srgb,var(--uc) 45%,transparent) 55%,transparent);z-index:1;pointer-events:none}
.unit .a,.unit .d,.unit .rg,.unit .kw,.unit .st,.unit .sc,.unit .fx,.unit .nm{z-index:3}
.slot.occ{background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--uc) 40%,transparent),color-mix(in srgb,var(--uc) 12%,transparent));border-color:color-mix(in srgb,var(--uc) 70%,transparent)}
.slot.occ.emo{border-color:var(--emo)}
.cls small.dk{font-size:11px;color:#a39a8a} .cls small.dk.own{color:#7fe07f}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.dslot{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#2a2232,#1a1520);border:2px solid var(--uc);border-radius:14px;padding:10px}
.dslot img{width:78px;height:78px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);flex:none}
.dslot .di{display:flex;flex-direction:column;gap:6px;min-width:0} .dslot b{font-family:Cinzel;color:var(--gold2)} .dslot small{font-size:13px;color:var(--mut)}
.okc{color:#7fe07f} .koc{color:#ff8a8a}
.ded{height:100%;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.ded .dh{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--uc)}
.pill.okp{color:#7fe07f;border-color:#7fe07f}
.dbody{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px;gap:12px}
.dpoolw{display:flex;flex-direction:column;gap:8px;min-height:0}
.dpool{flex:1;min-height:0;overflow:auto;display:grid;align-content:start;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;justify-items:center;padding:4px}
.dpc{position:relative;align-self:start;height:max-content} .dpc .cc{width:160px;height:250px} .dpc .cc .cart{height:96px} .dpc.full .cc{opacity:.45}
.dcnt{position:absolute;top:10px;left:50%;transform:translateX(-50%);line-height:1.3;background:#000c;border:1px solid var(--gold);border-radius:10px;padding:1px 8px;font-family:Cinzel;font-weight:700;font-size:12px;color:#fff;z-index:5;pointer-events:none}
.dinfo{position:absolute;top:58px;right:6px;line-height:1;z-index:5;background:#000b;border:1px solid var(--gold);border-radius:50%;width:28px;height:28px;font-size:13px;padding:0;color:#fff}
.dminus{position:absolute;top:52px;left:6px;z-index:6;width:34px;height:34px;border-radius:50%;padding:0;font-size:24px;font-weight:900;line-height:1;color:#fff;background:radial-gradient(#d2333f,#7a121b);border:2px solid #fff3cf;box-shadow:0 2px 8px #000c;display:flex;align-items:center;justify-content:center}
.dminus:active{transform:scale(.92)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden} .seg button{background:#0b0a0e;border:0;color:var(--mut);padding:7px 12px;font-size:13px} .seg button.on{background:var(--uc);color:#000;font-weight:700}
.cfil input#dQ{background:#0b0a0e;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 8px;font-family:inherit;font-size:14px;flex:1;min-width:120px}
.cfil select#dCost{background:#0b0a0e;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 8px;font-family:inherit;font-size:14px}
.dlist{display:flex;flex-direction:column;gap:8px;min-height:0;background:#0d0b10;border:1px solid var(--uc);border-radius:12px;padding:10px}
.drules{font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}
.dcurve{display:flex;gap:4px;align-items:flex-end;height:66px;padding:4px 0;border-bottom:1px solid var(--line)}
.dcurve div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:10px;color:var(--mut)}
.dcurve span{width:70%;background:linear-gradient(var(--uc),#0000);border-radius:3px 3px 0 0;min-height:2px} .dcurve i{font-style:normal;color:#fff} .dcurve b{font-weight:400}
.drows{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px}

<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http') && !window.claude){
  const hadCtrl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!hadCtrl||document.querySelector('.upd')) return;
    const b=document.createElement('div'); b.className='upd'; b.innerHTML='Nuova versione pronta <button>Aggiorna</button>';
    b.querySelector('button').onclick=()=>location.reload(); document.body.appendChild(b);
  });
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{
    if(r.waiting) r.waiting.postMessage('skip');
    setInterval(()=>r.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{}));
}
</script>
